# Draft mapping for the Pioneer DDJ-FLX4.
#
# DRAFT, to be confirmed by a capture (controllers/ddj-flx4/checklist.toml with
# `open-jockey midi capture`). Every MIDI value below comes from Pioneer's official list,
# "DDJ-FLX4 List of MIDI messages" Ver 1.0 (DDJ-FLX4_MIDI_message_List_E1.pdf, AlphaTheta,
# 2022), and from nowhere else. Behavior follows VirtualDJ's default layout for this
# controller, limited to the actions Open Jockey has; where that is unclear, the DDJ-SB3
# mapping's choice for the same physical control. Controls for features Open Jockey lacks
# stay unbound and are listed at the end.
# Channels are 1-based: status 0x90/0xB0 is channel 1 ... 0x96/0xB6 channel 7.
#
# Layering decision: NO layering, two decks.
# Evidence: every deck and mixer row of the list names only "Deck 1" (status 90/B0,
# channel 1) and "Deck 2" (91/B1, channel 2); the list has no DECK 3/4 buttons, no deck
# select message and no channels 3-4. The pads use channels 8 (deck 1) and 10 (deck 2),
# 9 and 11 with SHIFT. So every deck binding names `deck = 1` or `deck = 2`, nothing uses
# `side.deck_toggle`, and decks 3 and 4 are not reachable from this controller.
#
# SHIFT: the list gives most shifted buttons their own note (CUE 0x0C, SHIFT + CUE 0x48;
# PLAY 0x0B, SHIFT + PLAY 0x0E; BEAT SYNC 0x58, SHIFT 0x60), the shifted platter its own
# CC (0x29) and shifted pads their own channels. So, as on the SB3, shifted functions bind
# to the shifted message and need no `shift` condition. Three controls send the same
# message with or without SHIFT: TEMPO (cc14 0x00/0x20), the jog wheel side (cc 0x21) and
# the channel faders and crossfader (SHIFT only adds fader-start notes). SHIFT itself
# (note 0x3F) is still bound to `modifier.shift`.
#
# Pads: each hardware pad mode sends its own note bank (Hot Cue 0x00-0x07, Pad FX 1
# 0x10-0x17, Beat Jump 0x20-0x27, Sampler 0x30-0x37, Keyboard 0x40-0x47, Pad FX 2
# 0x50-0x57, Beat Loop 0x60-0x67, Key Shift 0x70-0x77), with the same notes on the SHIFT
# channel. The notes alone say which mode a pad press is in, so the pad bindings need no
# `pad_mode`.

[controller]
name = "Pioneer DDJ-FLX4"
port = "DDJ-FLX4"
# Pioneer's list does not give the jog resolution (it only says the jog sends the step
# count since the last message, 0x41 and up clockwise, 0x3F and down counter-clockwise).
# 720 steps per turn is an estimate, the SB3's value; tune it after the capture.
jog_steps_per_turn = 720

# MASTER LEVEL (cc14 ch7 0x08/0x28) and HEADPHONE LEVEL (cc14 ch7 0x0D/0x2D) are assumed
# to be applied by the FLX4's own audio interface, as on the SB3: the software levels stay
# at full and the knobs are left unbound. Check in the capture call that they change the
# volume with the app's levels at full.
[[init]]
action = "master.level"
value = 1.0

[[init]]
action = "master.headphone_level"
value = 1.0

# Both channel faders start closed, so no deck sounds until its fader is touched (soft
# takeover starts disarmed when the controller attaches; see the SB3 mapping).

[[init]]
action = "channel.fader"
deck = 1
value = 0.0

[[init]]
action = "channel.fader"
deck = 2
value = 0.0

# ------------------------------------------------------------ deck 1 (left side, channel 1)

# SHIFT
[[input]]
midi = { channel = 1, note = 0x3F }
action = "modifier.shift"
side = "left"

# PLAY/PAUSE (SHIFT + PLAY/PAUSE, note 0x0E, stays unbound as on the SB3)
[[input]]
midi = { channel = 1, note = 0x0B }
action = "deck.play_pause"
deck = 1

# CUE
[[input]]
midi = { channel = 1, note = 0x0C }
action = "deck.cue"
deck = 1

# SHIFT + CUE: back to the start of the track, as on the SB3
[[input]]
midi = { channel = 1, note = 0x48 }
action = "deck.return_to_start"
deck = 1

# BEAT SYNC. Pioneer's footnote *3: this button sends its message when the finger is
# released, not when it is pressed, so sync fires on release. The long press (note
# 0x5C, sync master/lock) stays unbound: Open Jockey has no sync lock.
[[input]]
midi = { channel = 1, note = 0x58 }
action = "deck.sync"
deck = 1

# SHIFT + BEAT SYNC: the FLX4 has no KEY LOCK or MASTER TEMPO button, and this is its
# tempo range button (the SB3's SHIFT + KEY LOCK sends the same note 0x60).
[[input]]
midi = { channel = 1, note = 0x60 }
action = "deck.tempo_range_next"
deck = 1

# TEMPO: Pioneer's list puts Min (0x00/0x00) at the "-" side and Max at the "+" side,
# so the value is not inverted (1 is faster). The list gives the same cc14 with SHIFT
# held, so one binding covers both. Confirm the direction in the capture.
[[input]]
midi = { channel = 1, cc14 = [0x00, 0x20] }
action = "deck.tempo"
deck = 1

# IN: loop in (SHIFT + IN, note 0x4C, stays unbound: no loop-in adjust)
[[input]]
midi = { channel = 1, note = 0x10 }
action = "deck.loop_in"
deck = 1

# OUT: loop out (SHIFT + OUT, note 0x4E, stays unbound: no loop-out adjust)
[[input]]
midi = { channel = 1, note = 0x11 }
action = "deck.loop_out"
deck = 1

# 4 BEAT / EXIT: a 4-beat loop, or leaves the active loop. deck.auto_loop does exactly
# that (4 beats at first; with a loop on, it switches it off).
[[input]]
midi = { channel = 1, note = 0x4D }
action = "deck.auto_loop"
deck = 1

# SHIFT + 4 BEAT / EXIT: reloop, as SHIFT + AUTO LOOP (same note 0x50) on the SB3
[[input]]
midi = { channel = 1, note = 0x50 }
action = "deck.reloop_exit"
deck = 1

# CUE/LOOP CALL left and right: halve and double the loop (what they do to an active
# loop; Open Jockey has no memory cues to call). SHIFT (0x3E / 0x3D, delete memory
# cue) stays unbound.
[[input]]
midi = { channel = 1, note = 0x51 }
action = "deck.loop_halve"
deck = 1

[[input]]
midi = { channel = 1, note = 0x53 }
action = "deck.loop_double"
deck = 1

# JOG platter touched or released
[[input]]
midi = { channel = 1, note = 0x36 }
action = "deck.jog_touch"
deck = 1

# SHIFT + JOG touch: only lets go (see the SB3 mapping)
[[input]]
midi = { channel = 1, note = 0x67 }
action = "deck.jog_release"
deck = 1

# JOG platter turned: 0x22 while the controller's vinyl mode is on, 0x23 while it is off
# (Pioneer's footnote *2: vinyl mode is set only by the software, default on). Both drive
# the top of the jog; the app's own vinyl mode decides whether a touched platter
# scratches. Steps: 0x41 and up clockwise, 0x3F and down counter-clockwise.
[[input]]
midi = { channel = 1, cc = 0x22 }
action = "deck.jog_top"
deck = 1
value = "relative_offset"

[[input]]
midi = { channel = 1, cc = 0x23 }
action = "deck.jog_top"
deck = 1
value = "relative_offset"

# JOG wheel side. The list gives the same cc 0x21 with SHIFT held, so the side has no
# SHIFT search.
[[input]]
midi = { channel = 1, cc = 0x21 }
action = "deck.jog_ring"
deck = 1
value = "relative_offset"

# SHIFT + JOG platter: fast search
[[input]]
midi = { channel = 1, cc = 0x29 }
action = "deck.jog_search"
deck = 1
value = "relative_offset"

# Mixer: TRIM
[[input]]
midi = { channel = 1, cc14 = [0x04, 0x24] }
action = "channel.trim"
deck = 1

# EQ HI
[[input]]
midi = { channel = 1, cc14 = [0x07, 0x27] }
action = "channel.eq_high"
deck = 1

# EQ MID
[[input]]
midi = { channel = 1, cc14 = [0x0B, 0x2B] }
action = "channel.eq_mid"
deck = 1

# EQ LOW
[[input]]
midi = { channel = 1, cc14 = [0x0F, 0x2F] }
action = "channel.eq_low"
deck = 1

# CFX knob (CH 1), channel 7: the filter, as the SB3's FILTER knob
[[input]]
midi = { channel = 7, cc14 = [0x17, 0x37] }
action = "channel.filter"
deck = 1

# CH FADER (SHIFT moves send fader-start notes 0x66 / 0x52 too: unbound, no fader start)
[[input]]
midi = { channel = 1, cc14 = [0x13, 0x33] }
action = "channel.fader"
deck = 1

# CH CUE (headphone cue). SHIFT + CH CUE (0x68) stays unbound until VirtualDJ's layout
# is checked.
[[input]]
midi = { channel = 1, note = 0x54 }
action = "channel.pfl_toggle"
deck = 1

# Pad mode buttons. The pads send a different bank per mode, so these only tell the
# window which mode the side shows. The SHIFT variants (0x69 Keyboard, 0x6B Pad FX 2,
# 0x6D Beat Loop, 0x6F Key Shift, by the order of the list's pad banks) stay unbound
# until the capture shows which bank each selects.

# HOT CUE MODE
[[input]]
midi = { channel = 1, note = 0x1B }
action = "pads.mode_hot_cue"
side = "left"

# PAD FX 1 MODE (Open Jockey has no pad FX; the pads stay unbound)
[[input]]
midi = { channel = 1, note = 0x1E }
action = "pads.mode_hardware"
side = "left"

# BEAT JUMP MODE
[[input]]
midi = { channel = 1, note = 0x20 }
action = "pads.mode_hardware"
side = "left"

# SAMPLER MODE
[[input]]
midi = { channel = 1, note = 0x22 }
action = "pads.mode_sampler"
side = "left"

# Pads, channel 8 (SHIFT: channel 9). Hot Cue mode: set or jump to hotcues; with SHIFT, delete them
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.hotcue_delete_{n}"
deck = 1

# Beat Jump mode (SHIFT: the shifted jump sizes)
[[input]]
midi = { channel = 8, notes = [0x20, 0x27] }
action = "deck.beat_jump_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x20, 0x27] }
action = "deck.beat_jump_shift_{n}"
deck = 1

# Sampler mode: play samples; with SHIFT, stop them (the sampler is shared by both decks)
[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "sampler.play_{n}"

[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "sampler.stop_{n}"

# Beat Loop mode: Open Jockey has no "loop of N beats" toggle, so the pads hold a loop
# roll of the pad's size instead (released, the track goes on). Bound on the SHIFT
# channel too, so a release after SHIFT went down still ends the roll.
[[input]]
midi = { channel = 8, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 1

# ------------------------------------------------------------ deck 2 (right side, channel 2)

# SHIFT
[[input]]
midi = { channel = 2, note = 0x3F }
action = "modifier.shift"
side = "right"

# PLAY/PAUSE
[[input]]
midi = { channel = 2, note = 0x0B }
action = "deck.play_pause"
deck = 2

# CUE
[[input]]
midi = { channel = 2, note = 0x0C }
action = "deck.cue"
deck = 2

# SHIFT + CUE
[[input]]
midi = { channel = 2, note = 0x48 }
action = "deck.return_to_start"
deck = 2

# BEAT SYNC (sends on release)
[[input]]
midi = { channel = 2, note = 0x58 }
action = "deck.sync"
deck = 2

# SHIFT + BEAT SYNC: tempo range
[[input]]
midi = { channel = 2, note = 0x60 }
action = "deck.tempo_range_next"
deck = 2

# TEMPO (same message with SHIFT)
[[input]]
midi = { channel = 2, cc14 = [0x00, 0x20] }
action = "deck.tempo"
deck = 2

# IN: loop in
[[input]]
midi = { channel = 2, note = 0x10 }
action = "deck.loop_in"
deck = 2

# OUT: loop out
[[input]]
midi = { channel = 2, note = 0x11 }
action = "deck.loop_out"
deck = 2

# 4 BEAT / EXIT
[[input]]
midi = { channel = 2, note = 0x4D }
action = "deck.auto_loop"
deck = 2

# SHIFT + 4 BEAT / EXIT: reloop
[[input]]
midi = { channel = 2, note = 0x50 }
action = "deck.reloop_exit"
deck = 2

# CUE/LOOP CALL left / right: loop halve / double
[[input]]
midi = { channel = 2, note = 0x51 }
action = "deck.loop_halve"
deck = 2

[[input]]
midi = { channel = 2, note = 0x53 }
action = "deck.loop_double"
deck = 2

# JOG platter touched or released
[[input]]
midi = { channel = 2, note = 0x36 }
action = "deck.jog_touch"
deck = 2

# SHIFT + JOG touch: only lets go (see the SB3 mapping)
[[input]]
midi = { channel = 2, note = 0x67 }
action = "deck.jog_release"
deck = 2

# JOG platter (vinyl on / vinyl off)
[[input]]
midi = { channel = 2, cc = 0x22 }
action = "deck.jog_top"
deck = 2
value = "relative_offset"

[[input]]
midi = { channel = 2, cc = 0x23 }
action = "deck.jog_top"
deck = 2
value = "relative_offset"

# JOG wheel side (same with SHIFT)
[[input]]
midi = { channel = 2, cc = 0x21 }
action = "deck.jog_ring"
deck = 2
value = "relative_offset"

# SHIFT + JOG platter: fast search
[[input]]
midi = { channel = 2, cc = 0x29 }
action = "deck.jog_search"
deck = 2
value = "relative_offset"

# Mixer: TRIM
[[input]]
midi = { channel = 2, cc14 = [0x04, 0x24] }
action = "channel.trim"
deck = 2

# EQ HI
[[input]]
midi = { channel = 2, cc14 = [0x07, 0x27] }
action = "channel.eq_high"
deck = 2

# EQ MID
[[input]]
midi = { channel = 2, cc14 = [0x0B, 0x2B] }
action = "channel.eq_mid"
deck = 2

# EQ LOW
[[input]]
midi = { channel = 2, cc14 = [0x0F, 0x2F] }
action = "channel.eq_low"
deck = 2

# CFX knob (CH 2), channel 7: the filter, as the SB3's FILTER knob
[[input]]
midi = { channel = 7, cc14 = [0x18, 0x38] }
action = "channel.filter"
deck = 2

# CH FADER
[[input]]
midi = { channel = 2, cc14 = [0x13, 0x33] }
action = "channel.fader"
deck = 2

# CH CUE (headphone cue)
[[input]]
midi = { channel = 2, note = 0x54 }
action = "channel.pfl_toggle"
deck = 2

# HOT CUE MODE
[[input]]
midi = { channel = 2, note = 0x1B }
action = "pads.mode_hot_cue"
side = "right"

# PAD FX 1 MODE
[[input]]
midi = { channel = 2, note = 0x1E }
action = "pads.mode_hardware"
side = "right"

# BEAT JUMP MODE
[[input]]
midi = { channel = 2, note = 0x20 }
action = "pads.mode_hardware"
side = "right"

# SAMPLER MODE
[[input]]
midi = { channel = 2, note = 0x22 }
action = "pads.mode_sampler"
side = "right"

# Pads, channel 10 (SHIFT: channel 11). Hot Cue mode: set or jump to hotcues; with SHIFT, delete them
[[input]]
midi = { channel = 10, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
deck = 2

[[input]]
midi = { channel = 11, notes = [0x00, 0x07] }
action = "deck.hotcue_delete_{n}"
deck = 2

# Beat Jump mode (SHIFT: the shifted jump sizes)
[[input]]
midi = { channel = 10, notes = [0x20, 0x27] }
action = "deck.beat_jump_{n}"
deck = 2

[[input]]
midi = { channel = 11, notes = [0x20, 0x27] }
action = "deck.beat_jump_shift_{n}"
deck = 2

# Sampler mode: play samples; with SHIFT, stop them (the sampler is shared by both decks)
[[input]]
midi = { channel = 10, notes = [0x30, 0x37] }
action = "sampler.play_{n}"

[[input]]
midi = { channel = 11, notes = [0x30, 0x37] }
action = "sampler.stop_{n}"

# Beat Loop mode: loop roll (also on the SHIFT channel)
[[input]]
midi = { channel = 10, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 2

[[input]]
midi = { channel = 11, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 2

# ------------------------------------------------------------------- mixer, global (channel 7)

# CROSSFADER: Min at the left side, Max at the right side
[[input]]
midi = { channel = 7, cc14 = [0x1F, 0x3F] }
action = "master.crossfader"

# HEADPHONE MIX (cc14 0x0C/0x2C): 0 is only the cue, 1 is only the master
[[input]]
midi = { channel = 7, cc14 = [0x0C, 0x2C] }
action = "master.headphone_mix"

# MASTER CUE: flips the headphones between all cue and all master, as the SB3's
# headphone MASTER button. The list gives it no LED message. SHIFT (0x78) stays unbound.
[[input]]
midi = { channel = 7, note = 0x63 }
action = "master.headphone_master_toggle"

# --------------------------------------------------------------------------- browser (channel 7)

# BROWSE rotate: 0x01 and up clockwise, 0x7F and down counter-clockwise, so two's
# complement steps, clockwise moving down the list
[[input]]
midi = { channel = 7, cc = 0x40 }
action = "browser.scroll"
value = "relative_twos"

# BROWSE press: switch between the tree and the track list
[[input]]
midi = { channel = 7, note = 0x41 }
action = "browser.toggle_focus"

# SHIFT + BROWSE press: open or close the highlighted folder
[[input]]
midi = { channel = 7, note = 0x42 }
action = "browser.toggle_folder"

# LOAD (deck 1)
[[input]]
midi = { channel = 7, note = 0x46 }
action = "deck.load_selected"
deck = 1

# LOAD (deck 2)
[[input]]
midi = { channel = 7, note = 0x47 }
action = "deck.load_selected"
deck = 2

# ------------------------------------------------------------------------ LEDs
#
# The list gives MIDI-OUT for PLAY/PAUSE, CUE and CH CUE on the same note as the button
# ("9n 0B hh", "9n 0C hh", "9n 54 hh"). Not yet seen lighting on the hardware: the
# capture's LED check confirms them.

[[output]]
state = "deck.play_led"
deck = 1
midi = { channel = 1, note = 0x0B }
on = 127
off = 0

[[output]]
state = "deck.cue_led"
deck = 1
midi = { channel = 1, note = 0x0C }
on = 127
off = 0

[[output]]
state = "channel.pfl"
deck = 1
midi = { channel = 1, note = 0x54 }
on = 127
off = 0

[[output]]
state = "deck.play_led"
deck = 2
midi = { channel = 2, note = 0x0B }
on = 127
off = 0

[[output]]
state = "deck.cue_led"
deck = 2
midi = { channel = 2, note = 0x0C }
on = 127
off = 0

[[output]]
state = "channel.pfl"
deck = 2
midi = { channel = 2, note = 0x54 }
on = 127
off = 0

# ----------------------------------------------------------------------------------
# Not mapped: controls in Pioneer's list without a binding, with their messages. Deck
# controls shown for deck 1 (channel 1, pads channel 8/9); deck 2 sends the same on
# channel 2 (pads 10/11).
#
#   SHIFT + PLAY/PAUSE 0x0E (as on the SB3)
#   BEAT SYNC long press 0x5C          (no sync lock)
#   SHIFT + IN 0x4C, SHIFT + OUT 0x4E  (no loop in/out adjust)
#   SHIFT + CUE/LOOP CALL 0x3E / 0x3D  (no memory cues)
#   SHIFT + CH CUE 0x68                (no matching action checked against VirtualDJ yet)
#   Fader start: CH FADER with SHIFT 0x66 / 0x52; CROSSFADER with SHIFT 0x66 / 0x52 on
#     status 90 and 91 (the list gives channel 7 for them but status 90/91: unclear)
#   Pad mode SHIFT buttons 0x69 / 0x6B / 0x6D / 0x6F
#   Pads: Pad FX 1 (0x10-0x17), Keyboard (0x40-0x47), Pad FX 2 (0x50-0x57), Key Shift
#     (0x70-0x77) banks, with and without SHIFT (no pad FX, keyboard or key shift)
#
#   Effects (no beat FX unit or channel assignment in Open Jockey), channels 5 and 6:
#     FX CH SELECT switch: notes 0x10 / 0x11 on channels 5 and 6, value 0x7F or 0x00 by
#       position (CH1, CH2, CH1&CH2)
#     FX SELECT 0x63 (SHIFT 0x64), BEAT left 0x4A (SHIFT 0x66), BEAT right 0x4B
#     (SHIFT 0x6B), LEVEL/DEPTH cc14 0x02/0x22 (the list says channel 6 but status B4,
#     channel 5), FX ON/OFF 0x47 (SHIFT 0x43) on channel 5 or 6
#
#   Global, channel 7:
#     MASTER LEVEL cc14 0x08/0x28, HEADPHONE LEVEL cc14 0x0D/0x2D (see [[init]])
#     MIC LEVEL cc14 0x05/0x25, Android MONO/STEREO note 0x6D
#     SMART CFX 0x00 (SHIFT 0x08), SMART FADER 0x01 (SHIFT 0x09) (no such features)
#     MASTER CUE SHIFT 0x78
#     BROWSE: SHIFT + rotate cc 0x64; SHIFT + LOAD 0x68 (deck 1) / 0x7A (deck 2)
#   LED outputs not driven: LOADED illumination (ch16 notes 0x00 / 0x01), VINYL MODE
#     (ch1/ch2 note 0x17, default on), CH LEVEL METER (ch1/ch2 cc 0x02), the pad and
#     pad-mode LEDs, FX ON/OFF
