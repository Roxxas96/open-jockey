prompt = "Press and release LEFT CUE/LOOP CALL left arrow."
kind = "button"
shift = true

# 1-9
[[section.step]]
id = "deck{deck}.call_right"
prompt = "Press and release LEFT CUE/LOOP CALL right arrow."
kind = "button"
shift = true

# 1-4 touch
[[section.step]]
id = "deck{deck}.jog_touch"
prompt = "Touch the top plate of the LEFT jog wheel without turning it, then let go."
kind = "button"
shift = true

# 1-4 platter (also gives jog_steps_per_turn)
[[section.step]]
id = "deck{deck}.jog_top"
prompt = "Keep a hand on the top plate of the LEFT jog wheel: turn it exactly one turn clockwise, then one turn counter-clockwise."
kind = "jog"
shift = true

# 1-4 wheel side
