kind = "button"
shift = true

# 1-10 long press
[[section.step]]
id = "deck{deck}.beat_sync_long"
prompt = "Press LEFT BEAT SYNC and hold it for about two seconds, then release."
kind = "button"

# 1-5
[[section.step]]
id = "deck{deck}.loop_in"
prompt = "Press and release LEFT IN."
kind = "button"
shift = true

# 1-6
[[section.step]]
id = "deck{deck}.loop_out"
prompt = "Press and release LEFT OUT."
kind = "button"
shift = true

# 1-7
[[section.step]]
