# Capture checklist for the Pioneer DDJ-FLX4, used by `open-jockey midi capture`.
#
# The control list follows Pioneer's "DDJ-FLX4 List of MIDI messages" Ver 1.0 (E1; its
# figure labels 1-1 to 1-11, 2-1 to 2-6, 3-1 to 3-15, 4-1 to 4-3 and 5-1 to 5-5 are in the
# step comments). Only the list of controls is taken from there; the capture confirms or
# corrects the draft mapping in controllers/ddj-flx4/mapping.toml, whose values come from
# the same list.
#
# Each section may repeat once per deck (`decks`), with {deck} substituted in its name,
# setup, ids and prompts. A step with `shift = true` is also captured with SHIFT held, as
# a separate step whose id ends in ".shift"; `held_shift` marks a step that is itself done
# with SHIFT held. `prepare` is done before listening starts, so that action is not
# recorded. A section's `shift_control` names the earlier SHIFT button steps whose notes
# are ignored in its SHIFT steps.
#
# The FLX4 has two decks and no DECK buttons: the left side is deck 1, the right side
# deck 2.

controller = "Pioneer DDJ-FLX4"

# Nothing is ignored yet. If the capture shows messages nobody caused (a periodic message,
# knob positions sent with buttons), mark them as noise with `x` during the capture.
[ignore]
sources = []

[[section]]
name = "Left deck {deck}"
decks = [1]
setup = "Use the LEFT side (deck {deck}). For SHIFT steps, hold the LEFT SHIFT."
shift_control = "deck{deck}.shift"

# 1-3
[[section.step]]
id = "deck{deck}.shift"
prompt = "Press and release LEFT SHIFT."
kind = "button"

# 1-1
[[section.step]]
id = "deck{deck}.play"
prompt = "Press and release LEFT PLAY/PAUSE."
kind = "button"
shift = true

# 1-2
[[section.step]]
