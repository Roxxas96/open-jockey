# Capture checklist for the Pioneer DDJ-GRV6, used by `open-jockey midi capture`.
#
# The control list follows Pioneer's "DDJ-GRV6 MIDI Message List" E1 (its figure labels
# B1-B6, D1-D20, G1-G11, M1-M15, F1-F9, P1-P12 are in the step comments). Only the list of
# controls is taken from there; the capture confirms or corrects the draft mapping in
# controllers/ddj-grv6/mapping.toml, whose values come from the same list.
#
# Each section may repeat once per deck (`decks`), with {deck} substituted in its name,
# setup, ids and prompts. A step with `shift = true` is also captured with SHIFT held, as
# a separate step whose id ends in ".shift"; `held_shift` marks a step that is itself done
# with SHIFT held. `prepare` is done before listening starts, so that action is not
# recorded. A section's `shift_control` names the earlier SHIFT button steps whose notes
# are ignored in its SHIFT steps.
#
# The GRV6 is hardware layered (each deck sends on its own channel), so every deck is
# captured: the left side for decks 1 and 3, the right side for decks 2 and 4. Each deck
# section starts by selecting its deck with the DECK buttons.

controller = "Pioneer DDJ-GRV6"

# Nothing is ignored yet. If the capture shows messages nobody caused (a periodic message,
# knob positions sent with buttons), mark them as noise with `x` during the capture.
[ignore]
sources = []

[[section]]
name = "Left deck {deck}"
decks = [1, 3]
setup = "Use the LEFT side. Press DECK {deck} so the LEFT side controls deck {deck}. For SHIFT steps, hold the LEFT SHIFT."
shift_control = "deck{deck}.shift"

