# Pads, channel 12 (SHIFT: channel 13). Hot Cue mode: set or jump to hotcues; with SHIFT, delete them
[[input]]
midi = { channel = 12, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
deck = 3

[[input]]
midi = { channel = 13, notes = [0x00, 0x07] }
action = "deck.hotcue_delete_{n}"
deck = 3

# Stems mode, pads 1-4
[[input]]
midi = { channel = 12, note = 0x10 }
