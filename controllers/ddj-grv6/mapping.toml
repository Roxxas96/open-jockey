# Draft mapping for the Pioneer DDJ-GRV6.
#
# DRAFT, to be confirmed by a capture (controllers/ddj-grv6/checklist.toml with
# `open-jockey midi capture`). Every MIDI value below comes from Pioneer's official list,
# "DDJ-GRV6 MIDI Message List" E1 (DDJ-GRV6_MIDI_Message_List_E1.pdf, AlphaTheta, 2024),
# and from nowhere else. Behavior follows VirtualDJ's default layout for this controller,
# limited to the actions Open Jockey has; where that is unclear, the DDJ-SB3 mapping's choice
# for the same physical control. Controls for features Open Jockey lacks stay unbound and
# are listed at the end.
# Channels are 1-based: status 0x90/0xB0 is channel 1 ... 0x96/0xB6 channel 7.
#
# Layering decision: HARDWARE layering.
# Evidence: the list's channel table gives "CH 1, DECK 1" to "CH 4, DECK 4" their own MIDI
# channels 1-4 (status 9n/Bn with n = 0-3), and every deck and mixer row is listed for
# "1/2/3/4". The DECK 1-4 buttons switch the controller itself: DECK 3 sends note 0x3C
# with 0x00 on channel 1 ("Deck 1 control off") and 0x7F on channel 3 ("Deck 3 control
# on"). Performance pads have their own channels per deck: 8/10/12/14 for decks 1-4
# without SHIFT, 9/11/13/15 with SHIFT. So every deck binding names its `deck`, and the
# DECK buttons stay unbound: the controller already sends on the right channel, and
# `side.deck_toggle` would only flip the window's view out of step with it.
#
# SHIFT: the list gives every shifted button its own note (CUE 0x0C, SHIFT + CUE 0x48;
# PLAY 0x0B, SHIFT + PLAY 0x47), shifted jog moves their own CCs (platter 0x29, wheel side
# 0x26), shifted pads their own channels and the shifted TEMPO slider its own cc14
# (0x05/0x25). So, as on the SB3, shifted functions bind to the shifted message and need
# no `shift` condition. SHIFT itself (note 0x3F) is still bound to `modifier.shift`.
#
# Pads: each hardware pad mode sends its own note bank (Hot Cue 0x00-0x07, Stems
# 0x10-0x17, Beat Jump 0x20-0x27, Sampler 0x30-0x37, Keyboard 0x40-0x47, Pad FX
# 0x50-0x57, Beat Loop 0x60-0x67, Key Shift 0x70-0x77), with the same notes on the SHIFT
# channel. The notes alone say which mode a pad press is in, so the pad bindings need
# no `pad_mode`. Which mode button (or SHIFT + mode button) selects which bank is not in
# the list: the capture confirms it.

[controller]
name = "Pioneer DDJ-GRV6"
port = "DDJ-GRV6"
# Pioneer's list does not give the jog resolution (it only says the jog sends the step
# count since the last message, 65 and up clockwise, 63 and down counter-clockwise).
# 720 steps per turn is an estimate, the SB3's value; tune it after the capture.
jog_steps_per_turn = 720

# MASTER LEVEL (cc14 ch7 0x08/0x28) and HEADPHONES LEVEL (cc14 ch7 0x0D/0x2D) are
# assumed to be applied by the GRV6's own audio interface, as on the SB3: the software
# levels stay at full and the knobs are left unbound.
[[init]]
action = "master.level"
value = 1.0

[[init]]
action = "master.headphone_level"
value = 1.0

# Every channel fader starts closed, so no deck sounds until its fader is touched (soft
# takeover starts disarmed when the controller attaches; see the SB3 mapping).

[[init]]
action = "channel.fader"
deck = 1
value = 0.0

[[init]]
action = "channel.fader"
deck = 2
value = 0.0

[[init]]
action = "channel.fader"
deck = 3
value = 0.0

[[init]]
action = "channel.fader"
deck = 4
value = 0.0

# ------------------------------------------------------------ deck 1 (left side, channel 1)

# SHIFT
[[input]]
midi = { channel = 1, note = 0x3F }
action = "modifier.shift"
side = "left"

# PLAY/PAUSE (SHIFT + PLAY/PAUSE, note 0x47, stays unbound as on the SB3)
[[input]]
midi = { channel = 1, note = 0x0B }
action = "deck.play_pause"
deck = 1

# CUE
[[input]]
midi = { channel = 1, note = 0x0C }
action = "deck.cue"
deck = 1

# SHIFT + CUE
[[input]]
midi = { channel = 1, note = 0x48 }
action = "deck.return_to_start"
deck = 1

# BEAT SYNC (SHIFT + BEAT SYNC, note 0x5C, stays unbound as on the SB3)
[[input]]
midi = { channel = 1, note = 0x58 }
action = "deck.sync"
deck = 1

# MASTER TEMPO (key lock)
[[input]]
midi = { channel = 1, note = 0x1A }
action = "deck.keylock_toggle"
deck = 1

# SHIFT + MASTER TEMPO: tempo range, as SHIFT + KEY LOCK on the SB3
[[input]]
midi = { channel = 1, note = 0x60 }
action = "deck.tempo_range_next"
deck = 1

# TEMPO: Pioneer's list puts Min (0x00/0x00) at the "-" side and Max at the "+" side,
# so the value is not inverted (1 is faster). Confirm the direction in the capture.
[[input]]
midi = { channel = 1, cc14 = [0x00, 0x20] }
action = "deck.tempo"
deck = 1

# SHIFT + TEMPO: the slider sends its position on 0x05/0x25 while SHIFT is held; bound
# to the same tempo so moving it with SHIFT held still works (soft takeover re-arms
# the other message).
[[input]]
midi = { channel = 1, cc14 = [0x05, 0x25] }
action = "deck.tempo"
deck = 1

# SLIP
[[input]]
midi = { channel = 1, note = 0x40 }
action = "deck.slip_toggle"
deck = 1

# SHIFT + SLIP sends 0x17, the SB3's VINYL note: vinyl mode on or off (the GRV6 has no
# VINYL button).
[[input]]
midi = { channel = 1, note = 0x17 }
action = "deck.vinyl_toggle"
deck = 1

# IN / 4 BEAT: loop in
[[input]]
midi = { channel = 1, note = 0x10 }
action = "deck.loop_in"
deck = 1

# IN / 4 BEAT long press (note 0x14, listed as its own message): a 4-beat loop. The
# press first sends 0x10 (loop in, which only clears an old loop), then this.
[[input]]
midi = { channel = 1, note = 0x14 }
action = "deck.auto_loop"
deck = 1

# OUT: loop out
[[input]]
midi = { channel = 1, note = 0x11 }
action = "deck.loop_out"
deck = 1

# RELOOP / EXIT
[[input]]
midi = { channel = 1, note = 0x4D }
action = "deck.reloop_exit"
deck = 1

# CUE/LOOP CALL left and right: halve and double the loop (what they do to an active
# loop; Open Jockey has no memory cues to call).
[[input]]
midi = { channel = 1, note = 0x51 }
action = "deck.loop_halve"
deck = 1

[[input]]
midi = { channel = 1, note = 0x53 }
action = "deck.loop_double"
deck = 1

# JOG platter touched or released
[[input]]
midi = { channel = 1, note = 0x36 }
action = "deck.jog_touch"
deck = 1

# SHIFT + JOG touch: only lets go (see the SB3 mapping)
[[input]]
midi = { channel = 1, note = 0x67 }
action = "deck.jog_release"
deck = 1

# JOG platter: Pioneer lists 0x22 with "Vinyl on" and 0x23 with "Vinyl off" (the
# controller's own vinyl state). Both drive the top of the jog; the app's vinyl mode
# (SHIFT + SLIP above) decides whether a touched platter scratches.
[[input]]
midi = { channel = 1, cc = 0x22 }
action = "deck.jog_top"
deck = 1
value = "relative_offset"

[[input]]
midi = { channel = 1, cc = 0x23 }
action = "deck.jog_top"
deck = 1
value = "relative_offset"

# JOG wheel side
[[input]]
midi = { channel = 1, cc = 0x21 }
action = "deck.jog_ring"
deck = 1
value = "relative_offset"

# SHIFT + JOG platter: fast search
[[input]]
midi = { channel = 1, cc = 0x29 }
action = "deck.jog_search"
deck = 1
value = "relative_offset"

# SHIFT + JOG wheel side: fast search
[[input]]
midi = { channel = 1, cc = 0x26 }
action = "deck.jog_search"
deck = 1
value = "relative_offset"

# Mixer: TRIM
[[input]]
midi = { channel = 1, cc14 = [0x04, 0x24] }
action = "channel.trim"
deck = 1

# EQ HI
[[input]]
midi = { channel = 1, cc14 = [0x07, 0x27] }
action = "channel.eq_high"
deck = 1

# EQ MID
[[input]]
midi = { channel = 1, cc14 = [0x0B, 0x2B] }
action = "channel.eq_mid"
deck = 1

# EQ LOW
[[input]]
midi = { channel = 1, cc14 = [0x0F, 0x2F] }
action = "channel.eq_low"
deck = 1

# SOUND COLOR FX (CH 1) knob, channel 7: the filter, as the SB3's FILTER knob on the
# same messages
[[input]]
midi = { channel = 7, cc14 = [0x17, 0x37] }
action = "channel.filter"
deck = 1

# CH FADER
[[input]]
midi = { channel = 1, cc14 = [0x13, 0x33] }
action = "channel.fader"
deck = 1

# CH CUE (headphone cue)
[[input]]
midi = { channel = 1, note = 0x54 }
action = "channel.pfl_toggle"
deck = 1

# Pad mode buttons. The pads send a different bank per mode, so these only tell the
# window which mode the side shows. SHIFT variants (0x69, 0x6B, 0x6D, 0x6F) and SAMPLER's
# long press (0x79) stay unbound until the capture shows which bank they select.

# HOT CUE MODE
[[input]]
midi = { channel = 1, note = 0x1B }
action = "pads.mode_hot_cue"
side = "left"

# STEMS MODE
[[input]]
midi = { channel = 1, note = 0x1E }
action = "pads.mode_hardware"
side = "left"

# BEAT JUMP MODE
[[input]]
midi = { channel = 1, note = 0x20 }
action = "pads.mode_hardware"
side = "left"

# SAMPLER MODE
[[input]]
midi = { channel = 1, note = 0x22 }
action = "pads.mode_sampler"
side = "left"

# Pads, channel 8 (SHIFT: channel 9). Hot Cue mode: set or jump to hotcues; with SHIFT, delete them
[[input]]
midi = { channel = 8, notes = [0x00, 0x07] }
action = "deck.hotcue_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x00, 0x07] }
action = "deck.hotcue_delete_{n}"
deck = 1

# Stems mode, pads 1-4: vocals, instruments, bass, rhythm (drums) on and off. Pads
# 5-8 and SHIFT stay unbound until the capture and VirtualDJ's layout say more.
[[input]]
midi = { channel = 8, note = 0x10 }
action = "deck.stem_toggle_vocals"
deck = 1

[[input]]
midi = { channel = 8, note = 0x11 }
action = "deck.stem_toggle_instruments"
deck = 1

[[input]]
midi = { channel = 8, note = 0x12 }
action = "deck.stem_toggle_bass"
deck = 1

[[input]]
midi = { channel = 8, note = 0x13 }
action = "deck.stem_toggle_rhythm"
deck = 1

# Beat Jump mode (SHIFT: the shifted jump sizes)
[[input]]
midi = { channel = 8, notes = [0x20, 0x27] }
action = "deck.beat_jump_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x20, 0x27] }
action = "deck.beat_jump_shift_{n}"
deck = 1

# Sampler mode: play samples; with SHIFT, stop them (the sampler is shared by all decks)
[[input]]
midi = { channel = 8, notes = [0x30, 0x37] }
action = "sampler.play_{n}"

[[input]]
midi = { channel = 9, notes = [0x30, 0x37] }
action = "sampler.stop_{n}"

# Beat Loop mode: Open Jockey has no "loop of N beats" toggle, so the pads hold a loop
# roll of the pad's size instead (released, the track goes on). Bound on the SHIFT
# channel too, so a release after SHIFT went down still ends the roll.
[[input]]
midi = { channel = 8, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 1

[[input]]
midi = { channel = 9, notes = [0x60, 0x67] }
action = "deck.loop_roll_{n}"
deck = 1

