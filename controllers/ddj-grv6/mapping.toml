# ----------------------------------------------------------------------------------
# Not mapped: controls in Pioneer's list without a binding, with their messages. Deck
# controls shown for deck 1 (channel 1); decks 2-4 send the same on channels 2-4.
#
#   DECK 1-4 buttons     notes 0x72 / 0x3C, SHIFT 0x73 (the controller switches decks itself)
#   SHIFT + PLAY 0x47, SHIFT + BEAT SYNC 0x5C (as on the SB3)
#   QUANTIZE 0x35, SHIFT 0x68         (Open Jockey has no quantize)
#   KEY SYNC 0x65, SHIFT 0x64         (no key sync)
#   MEMORY 0x3D, SHIFT 0x3E           (no memory cues)
#   SHIFT + IN 0x4C, SHIFT + OUT 0x77, SHIFT + RELOOP/EXIT 0x50,
#   SHIFT + CUE/LOOP CALL 0x61 / 0x62 (no matching actions)
#   SHIFT + CH CUE 0x39; fader start notes 0x66 / 0x5D / 0x52 (no fader start)
#   Pad mode SHIFT buttons 0x69 / 0x6B / 0x6D / 0x6F, SAMPLER long press 0x79
#   Pads: Stems pads 5-8 (0x14-0x17) and SHIFT Stems, Keyboard (0x40-0x47), Pad FX
#     (0x50-0x57), Key Shift (0x70-0x77) banks (no keyboard, pad FX or key shift)
#   GROOVE CIRCUIT: GAIN cc14 0x12/0x32, DRUM SWAP 1-4 0x00-0x03 (SHIFT 0x2C-0x2F), CAPTURE
#     0x08 (SHIFT 0x2B), DRUM ROLL 1-4 0x04-0x07 (SHIFT 0x30-0x33), DRUM RELEASE tilt
#     0x24 / 0x26 / 0x27 (no groove circuit in Open Jockey)
#
#   Effects (no beat FX unit or channel assignment in Open Jockey):
#     SOUND COLOR FX ON/OFF ch7 note 0x00 (SHIFT 0x08)
#     channel 5: BEAT left/right 0x4A / 0x4B (SHIFT 0x66 / 0x6B), BEAT FX SELECT
#     0x20-0x2D, BEAT FX CH SELECT 1-4 / SP / MST 0x10-0x13 / 0x16 / 0x14 (SHIFT +8),
#     LEVEL/DEPTH cc14 0x02/0x22, BEAT FX ON/OFF 0x47 (SHIFT 0x43)
#
#   Global, channel 7:
#     MASTER LEVEL cc14 0x08/0x28, HEADPHONES LEVEL cc14 0x0D/0x2D (see [[init]])
#     BOOTH LEVEL cc14 0x09/0x29, MIC LEVEL cc14 0x05/0x25, MONO/STEREO note 0x6D
#     MASTER CUE SHIFT 0x62
#     SMART ROTARY SELECTOR: SHIFT + rotate cc 0x64; tilt forward 0x38 (SHIFT 0x39),
#       backward 0x3A (0x3B), left 0x3C (0x3D), right 0x2E (0x3F)
#     DISCOVER 0x35 (SHIFT 0x68), BACK 0x65 (0x66), SHIFT + VIEW 0x67,
#     PREVIEW 0x36 (0x37), SHIFT + LOAD 1-4 0x58 / 0x59 / 0x60 / 0x61
#   LED outputs not driven: LOAD illumination (ch16 notes 0x00-0x03), JOG indicator
#     (ch16 cc 0x00-0x03), level meters (cc 0x02), BEAT FX beat indicator (ch5 cc 0x64)
