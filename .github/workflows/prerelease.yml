name: Pre-release (Windows)

# A Windows build for testing, published as a GitHub pre-release. Not a release: no signing,
# no installer. Run it by hand with a tag name, or push a tag like v0.0.0-pre.1.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release tag (e.g. v0.0.0-pre.1)
        required: true
  push:
    tags: [v*-pre*]

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: cargo build --release --locked -p open-jockey
      # Shows which DLLs the exe needs, so a missing one is visible in the log.
      - name: List DLL dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /dependents target\release\open-jockey.exe
      - name: Package
        shell: pwsh
        run: |
          $dir = "open-jockey-$env:TAG-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\open-jockey.exe $dir
          Get-ChildItem target\release\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dir
          Copy-Item LICENSE $dir
          Copy-Item docs\prerelease-windows.md "$dir\README.md"
          Copy-Item packaging\windows\* $dir
          # The repository keeps LF; cmd.exe wants CRLF in batch files.
          foreach ($bat in Get-ChildItem "$dir\*.bat") {
            $text = (Get-Content -Raw $bat.FullName) -replace "`r?`n", "`r`n"
            [IO.File]::WriteAllText($bat.FullName, $text)
          }
          New-Item -ItemType Directory "$dir\controllers" | Out-Null
          foreach ($c in Get-ChildItem controllers -Directory) {
            New-Item -ItemType Directory "$dir\controllers\$($c.Name)" | Out-Null
            Copy-Item "$($c.FullName)\mapping.toml","$($c.FullName)\checklist.toml" "$dir\controllers\$($c.Name)" -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length
      - name: Publish the pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "open-jockey-$env:TAG-windows-x64.zip"
          gh release create $env:TAG $zip --prerelease --target $env:GITHUB_SHA `
            --title "Open Jockey $env:TAG (Windows test build)" `
            --notes "A Windows build for testing. Not a release: unsigned, no installer. Windows SmartScreen will warn; choose More info, then Run anyway. Setup steps are in README.md inside the zip."
